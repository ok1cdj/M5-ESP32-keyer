; M5-ESP32-keyer v2 — PlatformIO configuration
; Board differences live here only: pinout as build flags, the status display
; module via build_src_filter. The code has no board #ifdefs.

[platformio]
default_envs = atoms3-lite

[esp32_common]
; pioarduino fork of the ESP32 platform (same pin as ok1cdj/M5-ESP32-BT-MIDI).
; Pin the exact fork+tag so CI resolves the same platform that builds locally.
; 55.03.312-1 is needed for PlatformIO 6.2 / SCons 4.11 with the hybrid compile.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.7
    h2zero/NimBLE-Arduino@^2.3.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.4.0
build_src_filter = +<*> -<ui/ui_display.cpp>

; ---- Atom family ----------------------------------------------------------
; Functions sit on the same positions on all boards. The radio side is on
; the Grove port (one cable: GND 5V CIV KEY), the paddles and the battery on
; the side header:
;               Grove           side header
;               SCL  SDA        DOT  DASH BAT
;   Atom Lite   G32  G26        G19  G23  G33
;   AtomS3      G1   G2         G6   G7   G8
;               CIV  KEY
; CIV is reserved for the planned CI-V interface, not used yet. M5Unified only
; assigns the Grove pins to Ex_I2C and never starts it (external_rtc/imu off).
; None of these is a strapping pin (ESP32: 0 2 5 12 15, ESP32-S3: 0 3 45 46)
; and none is input-only, so the paddle pins have internal pull-ups.
; M5GFX_BOARD skips the M5GFX/M5Unified board autodetection, which would
; otherwise toggle header pins (incl. G22/G19 on the Atom Lite) at boot.
; The RGB LED (G35 / G27) is driven by M5Unified (M5.Led).

; ---- BLE modem sleep on ESP32-S3 --------------------------------------------
; The prebuilt Arduino libs have CONFIG_BT_CTRL_MODEM_SLEEP off for ESP32-S3
; (ESP32 has CONFIG_BTDM_CTRL_MODEM_SLEEP on already), so the S3 envs rebuild
; the framework with it (pioarduino hybrid compile, ~2 min). Unused managed
; components are removed because some of them don't build in hybrid mode.
; Side effect: pioarduino rebuilds the shared framework libs in ~/.platformio
; and reinstalls the stock ones when an env without custom_sdkconfig builds.
[s3_ble_power]
custom_sdkconfig =
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
custom_component_remove =
    espressif/esp-modbus
    espressif/esp-dl
    espressif/esp_modem
    espressif/esp-sr
    espressif/esp32-camera
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/network_provisioning
    espressif/qrcode
    espressif/esp_hosted
    espressif/esp_wifi_remote
    chmorgan/esp-libhelix-mp3

[env:atoms3-lite]
extends = esp32_common
board = m5stack-atoms3
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_NAME=\"AtomS3\ Lite\"
    -DM5GFX_BOARD=board_t::board_M5AtomS3Lite
    -DKEY_PIN=2
    -DPADDLE_DOT_PIN=6
    -DPADDLE_DASH_PIN=7
    -DBAT_PIN=8
    -DBAT_CAL_PERMILLE=1038
    -DBTN_PIN=41
custom_sdkconfig = ${s3_ble_power.custom_sdkconfig}
custom_component_remove = ${s3_ble_power.custom_component_remove}

[env:atom-lite]
extends = esp32_common
board = m5stack-atom
; 4 MB flash: one big app partition (no OTA, out of scope for v2)
board_build.partitions = huge_app.csv
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_NAME=\"Atom\ Lite\"
    -DM5GFX_BOARD=board_t::board_M5AtomLite
    -DKEY_PIN=26
    -DPADDLE_DOT_PIN=19
    -DPADDLE_DASH_PIN=23
    -DBAT_PIN=33
    -DBTN_PIN=39

[env:atoms3]
extends = esp32_common
board = m5stack-atoms3
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_NAME=\"AtomS3\"
    -DM5GFX_BOARD=board_t::board_M5AtomS3
    -DKEY_PIN=2
    -DPADDLE_DOT_PIN=6
    -DPADDLE_DASH_PIN=7
    -DBAT_PIN=8
    -DBAT_CAL_PERMILLE=1038
    -DBTN_PIN=41
custom_sdkconfig = ${s3_ble_power.custom_sdkconfig}
custom_component_remove = ${s3_ble_power.custom_component_remove}
build_src_filter = +<*> -<ui/ui_led.cpp>

; ---- Host tests of the pure core and protocol (pio test -e native) --------
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
lib_compat_mode = off
